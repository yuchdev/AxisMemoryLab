# Proposed example configuration for axis-memory-lab (not an implemented CLI yet)
[collection]
profile = "lightweight"
lightweight_interval_seconds = 15
smaps_rollup_interval_seconds = 120
phase_inventory_only = true
clock_monotonic = true
max_sample_bytes = 65536
max_sample_elapsed_ms = 500
max_deep_snapshot_bytes = 2097152
max_deep_snapshot_elapsed_ms = 2000
deep_snapshot_cooldown_seconds = 900
ssh_timeout_seconds = 5
max_transient_buffer_bytes = 131072

[safety]
allow_root = false
allow_deep_snapshot = false
allow_remote_commands_that_mutate = false
capture_image_data = false
capture_plate_text = false
write_camera_flash = false
allow_ptrace = false

[analysis]
warmup_seconds = 600
minimum_valid_samples = 15
trend_metric = "process.pss_bytes"
normalize_by = ["time", "app.frame.processed_total", "app.recognition.completed_total"]

[privacy]
redact_addresses = true
redact_credentials = true
redact_cmdline = true
retain_raw_procfs_locally = true
