name: Native probe

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        flags:
          - "-DAXMEM_DISABLED=ON"
          - "-DAXMEM_COUNTERS=ON"
          - "-DAXMEM_LEDGER=ON"
          - "-DAXMEM_COUNTERS=ON -DAXMEM_SAMPLER=ON"
          - "-DAXMEM_LEDGER=ON -DAXMEM_SAMPLER=ON"
    steps:
      - uses: actions/checkout@v4
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Debug ${{ matrix.flags }}
      - run: cmake --build build/native --parallel
      - run: ctest --test-dir build/native --output-on-failure
