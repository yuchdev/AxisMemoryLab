name: Native probe

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        mode: [DISABLED, COUNTERS, LEDGER]
    steps:
      - uses: actions/checkout@v4
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Debug -DAXMEM_${{ matrix.mode }}=ON
      - run: cmake --build build/native --parallel
      - run: ctest --test-dir build/native --output-on-failure
