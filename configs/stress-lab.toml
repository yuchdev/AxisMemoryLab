[collection]
profile = "stress-lab"
source = "host_ssh"
sample_interval_seconds = 5
smaps_rollup_interval_seconds = 60
max_snapshot_bytes = 2097152
max_snapshot_seconds = 10
transient_buffer_bytes = 4194304
deep_snapshot_cooldown_seconds = 1800
ssh_connect_timeout_seconds = 5
ssh_command_timeout_seconds = 15

[safety]
allow_root = false
allow_deep_snapshot = false
allow_remote_commands_that_mutate = false
capture_image_data = false
capture_plate_text = false
write_camera_flash = false
allow_ptrace = false

[analysis]
warmup_seconds = 30
minimum_samples = 10
metrics = ["system.mem.available_bytes", "process.rss_anon_bytes", "process.pss_bytes"]
normalization = ["elapsed_seconds"]

[privacy]
redact_device_identity = true
redact_process_arguments = true
local_artifacts_only = true
exclude_raw_sensitive_data = true
